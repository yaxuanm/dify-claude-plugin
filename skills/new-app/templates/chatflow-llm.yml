app:
  name: My chatbot
  description: A conversational assistant.
  icon: 💬
  icon_background: '#E0F2FE'
  mode: advanced-chat
  use_icon_as_answer_icon: false
kind: app
version: 0.4.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: Hi! How can I help?
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 280
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: Start
        desc: ''
        variables: []
    - id: llm
      type: custom
      position:
        x: 400
        y: 280
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: LLM
        desc: ''
        model:
          provider: langgenius/openai/openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: You are a helpful assistant. <role, rules, tone here>
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: false
            size: 10
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: answer
      type: custom
      position:
        x: 720
        y: 280
      sourcePosition: right
      targetPosition: left
      data:
        type: answer
        title: Answer
        desc: ''
        answer: '{{#llm.text#}}'
        variables: []
    edges:
    - id: start-source-llm-target
      type: custom
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: llm-source-answer-target
      type: custom
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      data:
        sourceType: llm
        targetType: answer
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 0.8

app:
  name: My workflow
  description: One input in, one result out.
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.4.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 280
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: Start
        desc: ''
        variables:
        - variable: input_text
          label: Input text
          type: paragraph
          required: true
          max_length: 20000
          options: []
    - id: llm
      type: custom
      position:
        x: 400
        y: 280
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: LLM
        desc: ''
        model:
          provider: langgenius/openai/openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: You are a helpful assistant. <task instructions here>
        - role: user
          text: '{{#start.input_text#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: end
      type: custom
      position:
        x: 720
        y: 280
      sourcePosition: right
      targetPosition: left
      data:
        type: end
        title: End
        desc: ''
        outputs:
        - variable: result
          value_type: string
          value_selector:
          - llm
          - text
    edges:
    - id: start-source-llm-target
      type: custom
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: llm-source-end-target
      type: custom
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      data:
        sourceType: llm
        targetType: end
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 0.8
